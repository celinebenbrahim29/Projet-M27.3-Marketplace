
# Marketplace Analytics : API -> MinIO (raw) -> PostgreSQL (staging/dwh/analytics) -> Metabase.
# Airflow orchestre le pipeline ; Prometheus + Grafana supervisent. Mots de passe : fichier .env.

# Variables et paramètres communs aux services Airflow (évite de les répéter 4 fois).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
  # Connection `marketplace_api` lue par le Hook (host = URL de l'API, password = token).
  AIRFLOW_CONN_MARKETPLACE_API: '{"conn_type": "http", "host": "http://api-marketplace:5000", "password": "${API_TOKEN}"}'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment:
    <<: *airflow-env
    API_URL: http://api-marketplace:5000
    PGHOST: postgres-dwh
    PGPORT: "5432"
    MINIO_ENDPOINT: http://minio:9000
    PYTHONPATH: /opt/airflow/pipeline
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins:ro   # Hook MarketplaceAPIHook
    - ./pipeline:/opt/airflow/pipeline:ro
    - ./tests:/opt/airflow/tests:ro               # tests du Hook et du DAG (voir README)
    - airflow-logs:/opt/airflow/logs

services:
  # Data Warehouse : schémas staging, dwh, analytics (créés par sql/001_schema.sql au 1er démarrage).
  # Port hôte 5433 ; entre conteneurs, utiliser postgres-dwh:5432.
  postgres-dwh:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

  # Data lake : stocke les JSON bruts (bucket data-lake). Console web sur le port 9001.
  minio:
    image: ghcr.io/intikhab49/minio-from-source:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Source de données simulée (Flask), protégée par un token Bearer.
  api-marketplace:
    build: ./api
    environment:
      API_TOKEN: ${API_TOKEN}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      retries: 10

  # Code du pipeline. Reste actif pour exposer les métriques ; les chargements se lancent avec
  # `docker compose run --rm pipeline python runner.py ...` (voir README).
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    env_file: .env
    environment:
      API_URL: http://api-marketplace:5000
      PGHOST: postgres-dwh
      PGPORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
      METRICS_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres-dwh:
        condition: service_healthy
      api-marketplace:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["python", "-u", "runner.py", "serve"]

  # BI : dashboards métier sur le Data Warehouse. Ses dashboards sont conservés dans le volume metabase-data.
  metabase:
    image: metabase/metabase:v0.59.1
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - postgres-dwh

  # Supervision technique : postgres-exporter -> prometheus (collecte) -> grafana (graphiques).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dwh:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - postgres-dwh

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pipeline
      - postgres-exporter

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # Orchestration : base de métadonnées d'Airflow, puis initialisation, webserver et scheduler.
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Exécuté une fois : migre la base Airflow et crée l'utilisateur admin.
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-db:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users list | grep -q '^admin ' ||
        airflow users create \
          --username admin \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Marketplace \
          --lastname Admin \
          --role Admin \
          --email admin@example.local)

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-dwh:
        condition: service_healthy
      api-marketplace:
        condition: service_healthy
      minio:
        condition: service_started
    command: scheduler
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
  metabase-data:
  prometheus-data:
  grafana-data:
  airflow-db-data:
  airflow-logs:
