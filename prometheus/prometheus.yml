global:
  scrape_interval: 15s
scrape_configs:
  - job_name: marketplace-pipeline
    static_configs:
      - targets: ['pipeline:8000']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
